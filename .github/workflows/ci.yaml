name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Protocol foundation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Validate JSON and Python syntax
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/tuya_resilience/manifest.json >/dev/null
          python -m json.tool custom_components/tuya_resilience/translations/en.json >/dev/null
          python -m compileall -q custom_components tests

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q
