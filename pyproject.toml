[project]
name = "ha-tuya-resilience"
version = "0.1.0"
description = "Cloud-first, one-shot local Tuya resilience companion for Home Assistant"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
  "tinytuya==1.20.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
